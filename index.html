<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Office Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Sans Bengali (for Assamese script) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Touch Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'sans-serif'],
                        assamese: ['"Noto Sans Bengali"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
        
        body {
            background-color: #030b14;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Cinematic Photorealistic Underwater Ocean Background */
        .ocean-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background: linear-gradient(to bottom, #005c8a 0%, #00335c 40%, #011627 80%, #000814 100%);
            overflow: hidden;
        }

        /* Dynamic Underwater Caustic Light Simulation */
        .caustics {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 10%, rgba(100, 220, 255, 0.25) 0%, transparent 60%),
                        radial-gradient(circle at 20% 30%, rgba(0, 180, 220, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0, 150, 255, 0.15) 0%, transparent 50%);
            animation: causticPulse 6s ease-in-out infinite alternate;
            opacity: 0.85;
        }
        @keyframes causticPulse {
            0% { transform: scale(1) translateY(0); opacity: 0.7; }
            100% { transform: scale(1.08) translateY(-15px); opacity: 0.95; }
        }

        /* Realistic Underwater Flora (Kelp / Seaweed Forest swaying at bottom) */
        .seaweed-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40vh;
            pointer-events: none;
            z-index: -1;
            display: flex;
            justify-content: space-between;
            opacity: 0.75;
        }
        .kelp {
            width: 25px;
            height: 100%;
            background: linear-gradient(to top, rgba(2, 43, 30, 0.9), rgba(15, 110, 74, 0.6) 60%, transparent);
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            animation: swayKelp 5s ease-in-out infinite alternate;
        }
        .kelp:nth-child(2) { animation-duration: 6.5s; animation-delay: 1s; opacity: 0.6; }
        .kelp:nth-child(3) { animation-duration: 5.5s; animation-delay: 2s; }
        .kelp:nth-child(4) { animation-duration: 7s; animation-delay: 0.5s; opacity: 0.8; }
        .kelp:nth-child(5) { animation-duration: 6s; animation-delay: 1.5s; }

        @keyframes swayKelp {
            0% { transform: rotate(-8deg) skewX(-4deg); }
            100% { transform: rotate(10deg) skewX(5deg); }
        }

        /* Fast Moving Glowing Fish & Creature Schools */
        .creature-school {
            position: absolute;
            width: 140px;
            height: 60px;
            pointer-events: none;
            z-index: -1;
            animation: swimAcrossFast 12s linear infinite;
        }
        .wandering-creature {
            position: absolute;
            font-size: 14px;
            animation: tailWag 0.35s infinite alternate, autoColorShift 8s infinite alternate;
        }

        @keyframes tailWag {
            0% { transform: rotate(-10deg) scale(0.95); }
            100% { transform: rotate(10deg) scale(1.05); }
        }

        @keyframes autoColorShift {
            0% { filter: drop-shadow(0 0 6px #38bdf8) hue-rotate(0deg); color: #38bdf8; }
            33% { filter: drop-shadow(0 0 10px #34d399) hue-rotate(90deg); color: #34d399; }
            66% { filter: drop-shadow(0 0 10px #f43f5e) hue-rotate(180deg); color: #f43f5e; }
            100% { filter: drop-shadow(0 0 8px #c084fc) hue-rotate(270deg); color: #c084fc; }
        }

        @keyframes swimAcrossFast {
            0% { transform: translateX(-160px) translateY(30px); opacity: 0; }
            12% { opacity: 0.95; }
            88% { opacity: 0.95; }
            100% { transform: translateX(calc(100vw + 160px)) translateY(-80px); opacity: 0; }
        }

        .cs-1 { top: 12%; animation-duration: 14s; }
        .cs-2 { top: 35%; animation-duration: 10s; animation-delay: 4s; transform: scaleX(-1); }
        .cs-3 { top: 58%; animation-duration: 16s; animation-delay: 2s; }
        .cs-4 { top: 80%; animation-duration: 13s; animation-delay: 6s; transform: scaleX(-1); }

        /* Fast Moving Glowing Bioluminescent Jellyfish */
        .real-jellyfish {
            position: absolute;
            right: 8%;
            bottom: 30%;
            width: 60px;
            height: 90px;
            pointer-events: none;
            z-index: -1;
            animation: floatRealJellyFast 8s ease-in-out infinite alternate;
        }
        .rj-head {
            position: absolute;
            width: 60px;
            height: 45px;
            background: radial-gradient(circle at 35% 30%, rgba(233, 213, 255, 0.95), rgba(168, 85, 247, 0.6));
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 35px rgba(216, 180, 254, 0.95), inset 0 2px 5px rgba(255, 255, 255, 0.8);
        }
        .rj-tentacles {
            position: absolute;
            top: 40px;
            left: 12px;
            width: 36px;
            height: 45px;
            background: repeating-linear-gradient(90deg, rgba(243, 232, 255, 0.8), rgba(243, 232, 255, 0.8) 2px, transparent 2px, transparent 6px);
            animation: pulseTentacles 1.2s ease-in-out infinite alternate;
        }
        @keyframes floatRealJellyFast {
            0% { transform: translateY(0) translateX(0) scale(1); }
            50% { transform: translateY(-50px) translateX(15px) scale(1.05); }
            100% { transform: translateY(-90px) translateX(-10px) scale(0.98); }
        }
        @keyframes pulseTentacles {
            0% { transform: skewX(-6deg) scaleY(0.9); }
            100% { transform: skewX(6deg) scaleY(1.1); }
        }

        /* Second Smaller Glowing Jellyfish */
        .real-jellyfish-2 {
            position: absolute;
            left: 10%;
            top: 20%;
            width: 40px;
            height: 60px;
            pointer-events: none;
            z-index: -1;
            animation: floatJelly2 10s ease-in-out infinite alternate;
        }
        .rj2-head {
            position: absolute;
            width: 40px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.9), rgba(14, 116, 144, 0.5));
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.9);
        }
        .rj2-tentacles {
            position: absolute;
            top: 28px;
            left: 8px;
            width: 24px;
            height: 30px;
            background: repeating-linear-gradient(90deg, rgba(224, 242, 254, 0.7), rgba(224, 242, 254, 0.7) 2px, transparent 2px, transparent 5px);
        }
        @keyframes floatJelly2 {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(40px) translateX(-20px); }
            100% { transform: translateY(-30px) translateX(20px); }
        }

        /* Professional Scuba Diver with Responsive Positioning for Mobile & PC */
        .pro-diver {
            position: absolute;
            left: 3%;
            bottom: 42%;
            width: 75px;
            height: 45px;
            pointer-events: none;
            z-index: 5; /* Kept safely above background layers so it's fully visible on mobile screens */
            animation: diverMotionResponsive 10s ease-in-out infinite;
        }
        .pd-suit {
            position: absolute;
            top: 12px;
            left: 18px;
            width: 32px;
            height: 16px;
            background: #0f172a;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
        }
        .pd-tank {
            position: absolute;
            top: 7px;
            left: 22px;
            width: 11px;
            height: 20px;
            background: #cbd5e1;
            border-radius: 4px;
        }
        .pd-head {
            position: absolute;
            top: 10px;
            left: 48px;
            width: 11px;
            height: 11px;
            background: #e2a068;
            border-radius: 50%;
        }
        .pd-mask {
            position: absolute;
            top: 12px;
            left: 53px;
            width: 6px;
            height: 5px;
            background: #38bdf8;
            border-radius: 2px;
        }
        .pd-light {
            position: absolute;
            top: 15px;
            left: 60px;
            width: 8px;
            height: 4px;
            background: #fde047;
            border-radius: 2px;
        }
        .pd-beam {
            position: absolute;
            top: 10px;
            left: 66px;
            width: 45px;
            height: 16px;
            background: linear-gradient(90deg, rgba(253, 224, 71, 0.9), rgba(253, 224, 71, 0));
            clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%);
            box-shadow: 0 0 20px #fde047;
        }
        .pd-fin1 {
            position: absolute;
            top: 4px;
            left: 2px;
            width: 16px;
            height: 7px;
            background: #f59e0b;
            border-radius: 50% 20% 20% 50%;
            transform: rotate(-15deg);
        }
        .pd-fin2 {
            position: absolute;
            top: 25px;
            left: 2px;
            width: 16px;
            height: 7px;
            background: #f59e0b;
            border-radius: 50% 20% 20% 50%;
            transform: rotate(15deg);
        }
        .pd-bubbles {
            position: absolute;
            top: 2px;
            left: 50px;
            width: 4px;
            height: 24px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 30%, transparent 40%);
            background-size: 4px 6px;
            animation: bubbleRise 1.5s linear infinite;
        }
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.95; }
            100% { transform: translateY(-30px) scale(1.3); opacity: 0; }
        }
        .pd-name {
            position: absolute;
            top: -20px;
            left: -12px;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-family: 'Noto Sans Bengali', sans-serif;
            animation: nameGlowAndColorChange 6s infinite alternate;
        }

        @keyframes nameGlowAndColorChange {
            0% {
                color: #38bdf8;
                background: rgba(3, 11, 20, 0.85);
                border-color: rgba(56, 189, 248, 0.7);
                box-shadow: 0 0 10px #38bdf8, inset 0 0 5px rgba(56,189,248,0.5);
            }
            33% {
                color: #34d399;
                background: rgba(3, 20, 15, 0.85);
                border-color: rgba(52, 211, 153, 0.7);
                box-shadow: 0 0 14px #34d399, inset 0 0 5px rgba(52,211,153,0.5);
            }
            66% {
                color: #f43f5e;
                background: rgba(20, 3, 10, 0.85);
                border-color: rgba(244, 63, 94, 0.7);
                box-shadow: 0 0 14px #f43f5e, inset 0 0 5px rgba(244,63,94,0.5);
            }
            100% {
                color: #c084fc;
                background: rgba(15, 3, 20, 0.85);
                border-color: rgba(192, 132, 252, 0.7);
                box-shadow: 0 0 12px #c084fc, inset 0 0 5px rgba(192,132,252,0.5);
            }
        }

        @keyframes diverMotionResponsive {
            0% { transform: translate(0, 0) rotate(0deg); }
            40% { transform: translate(65px, -15px) rotate(6deg); }
            50% { transform: translate(55px, -10px) rotate(-2deg); }
            90% { transform: translate(-5px, 5px) rotate(-4deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Mobile specific adjustments to ensure diver stays fully in view */
        @media (max-width: 640px) {
            .pro-diver {
                left: 2%;
                bottom: 46%;
                transform: scale(0.85);
            }
            @keyframes diverMotionResponsive {
                0% { transform: translate(0, 0) rotate(0deg); }
                40% { transform: translate(45px, -10px) rotate(5deg); }
                50% { transform: translate(40px, -8px) rotate(-2deg); }
                90% { transform: translate(-2px, 3px) rotate(-3deg); }
                100% { transform: translate(0, 0) rotate(0deg); }
            }
        }

        /* Transparent Liquid Apple Glass Box Icons */
        .app-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.25rem 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .app-box:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 40px rgba(0, 150, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* Creature Icon Gentle Floating & Automatic Color/Glow Shifting Animation */
        .creature-icon-container {
            animation: creatureFloatAndGlow 3.5s ease-in-out infinite alternate, autoIconColorCycle 12s infinite linear;
        }

        @keyframes creatureFloatAndGlow {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-4px) rotate(2deg) scale(1.04); }
            100% { transform: translateY(3px) rotate(-2deg) scale(1); }
        }

        @keyframes autoIconColorCycle {
            0% {
                background-image: linear-gradient(to bottom right, #38bdf8, #6366f1);
                box-shadow: 0 0 12px rgba(56, 189, 248, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
            }
            25% {
                background-image: linear-gradient(to bottom right, #34d399, #0284c7);
                box-shadow: 0 0 16px rgba(52, 211, 153, 0.85), inset 0 1px 1px rgba(255,255,255,0.4);
            }
            50% {
                background-image: linear-gradient(to bottom right, #f43f5e, #fbbf24);
                box-shadow: 0 0 16px rgba(244, 63, 94, 0.85), inset 0 1px 1px rgba(255,255,255,0.4);
            }
            75% {
                background-image: linear-gradient(to bottom right, #c084fc, #38bdf8);
                box-shadow: 0 0 16px rgba(192, 132, 252, 0.85), inset 0 1px 1px rgba(255,255,255,0.4);
            }
            100% {
                background-image: linear-gradient(to bottom right, #38bdf8, #6366f1);
                box-shadow: 0 0 12px rgba(56, 189, 248, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
            }
        }

        /* Water Ripple Effect CSS */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .portal-item {
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .portal-item:nth-child(1) { animation-delay: 0.1s; }
        .portal-item:nth-child(2) { animation-delay: 0.16s; }
        .portal-item:nth-child(3) { animation-delay: 0.22s; }
        .portal-item:nth-child(4) { animation-delay: 0.28s; }
        .portal-item:nth-child(5) { animation-delay: 0.34s; }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen p-4 sm:p-6">

    <!-- Photorealistic Real Underwater Deep Ocean Background with Enhanced Flora & Fauna -->
    <div class="ocean-bg">
        <div class="caustics"></div>

        <!-- Underwater Kelp Forest Flora at bottom -->
        <div class="seaweed-container">
            <div class="kelp" style="width: 35px; height: 100%;"></div>
            <div class="kelp" style="width: 25px; height: 80%;"></div>
            <div class="kelp" style="width: 40px; height: 95%;"></div>
            <div class="kelp" style="width: 30px; height: 85%;"></div>
            <div class="kelp" style="width: 35px; height: 90%;"></div>
        </div>

        <!-- 14 Swimming Ocean Creatures & Schools with Automatic Color Shifting -->
        <div class="creature-school cs-1">
            <i class="fa-solid fa-fish wandering-creature" style="top:0px; left:0px; animation-delay: 0s;"></i>
            <i class="fa-solid fa-fish-fins wandering-creature" style="top:15px; left:25px; animation-delay: 1s;"></i>
            <i class="fa-solid fa-shrimp wandering-creature" style="top:8px; left:55px; animation-delay: 2s;"></i>
            <i class="fa-solid fa-fish wandering-creature" style="top:25px; left:35px; animation-delay: 1.5s;"></i>
        </div>
        <div class="creature-school cs-2">
            <i class="fa-solid fa-whale wandering-creature" style="top:5px; left:0px; font-size:18px; animation-delay: 0.5s;"></i>
            <i class="fa-solid fa-fish-fins wandering-creature" style="top:20px; left:40px; animation-delay: 2.2s;"></i>
            <i class="fa-solid fa-fish wandering-creature" style="top:10px; left:70px; animation-delay: 1.2s;"></i>
        </div>
        <div class="creature-school cs-3">
            <i class="fa-solid fa-otter wandering-creature" style="top:0px; left:10px; animation-delay: 0.8s;"></i>

        </div>

            <i class="fa-solid fa-fish wandering-creature" style="top:12px; left:15px; animation-delay: 1.8s;"></i>

        </div>

        <!-- Glowing Bioluminescent Jellyfishes -->
        <div class="real-jellyfish">
            <div class="rj-head"></div>
            <div class="rj-tentacles"></div>
        </div>

        <div class="real-jellyfish-2">
            <div class="rj2-head"></div>
            <div class="rj2-tentacles"></div>
        </div>

        <!-- Professional Scuba Diver (Darpan Sukla) with Responsive Mobile Positioning -->
        <div class="pro-diver">
            <div class="pd-name">দৰ্পণ শুক্লা</div>
            <div class="pd-tank"></div>
            <div class="pd-suit"></div>
            <div class="pd-head"></div>
            <div class="pd-mask"></div>
            <div class="pd-light"></div>
            <div class="pd-beam"></div>
            <div class="pd-fin1"></div>
            <div class="pd-fin2"></div>
            <div class="pd-bubbles"></div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="flex flex-col flex-1 w-full max-w-sm sm:max-w-md mx-auto space-y-4 pb-4 z-10">
        
        <!-- Header / Title -->
        <div class="text-center pt-2 pb-1 animate-fade-in-up">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 mb-2 shadow-lg creature-icon-container" style="animation-delay: 0s;">
                <i class="fa-solid fa-water text-white text-xl drop-shadow"></i>
            </div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white drop-shadow-md">Internship Office Portal</h1>
            <p class="text-xs text-cyan-200/90 font-medium mt-0.5">Created by Darpan Sukla</p>
        </div>

        <!-- Grid of Transparent Square App Boxes -->
        <div id="portals-grid" class="grid grid-cols-2 gap-3.5">
            <!-- Rendered via JS -->
        </div>

    </div>

    <!-- Footer Branding in English -->
    <footer class="w-full text-center py-2 text-[11px] text-white/70 font-medium animate-fade-in-up z-10 drop-shadow" style="animation-delay: 0.4s;">
        Designed & Developed by Darpan Sukla
    </footer>

    <!-- Application Script with Water Touch & Ripple Animation -->
    <script>
        const portalsData = [
            { 
                name: "Registration", 
                url: "https://darpansukla.github.io/Internship-Registration-Portal/", 
                icon: "fa-fish" 
            },
            { 
                name: "Payment Proof", 
                url: "https://darpansukla.github.io/Correct-Payment-Proof-Portal/", 
                icon: "fa-otter" 
            },
            { 
                name: "Dashboard", 
                url: "https://darpansukla.github.io/New-Internship-Dashboard/", 
                icon: "fa-shrimp" 
            },
            { 
                name: "Smart Data", 
                url: "https://darpansukla.github.io/Internship-Smart-Data-Portal/", 
                icon: "fa-whale" 
            },
            { 
                name: "Intership Site", 
                url: "https://sites.google.com/view/internship26/home?authuser=0", 
                icon: "fa-fish-fins" 
            }
        ];

        function renderPortalsList() {
            const gridEl = document.getElementById('portals-grid');
            gridEl.innerHTML = '';
            
            portalsData.forEach((item, index) => {
                let card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank";
                if(index === 4) {
                    card.className = "app-box portal-item col-span-2 py-3.5 flex-row space-x-3 justify-center";
                } else {
                    card.className = "app-box portal-item";
                }

                // Stagger automatic color-shift animation delay for each icon box
                let animDelay = (index * 2.4) + 's';

                // Water touch / splash effect on click
                card.addEventListener('click', function(e) {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    card.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);

                    confetti({
                        particleCount: 15,
                        spread: 60,
                        origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                        colors: ['#38bdf8', '#34d399', '#f43f5e', '#c084fc'],
                        shapes: ['circle'],
                        scalar: 0.75
                    });
                });

                if(index === 4) {
                    card.innerHTML = `
                        <div class="w-10 h-10 rounded-xl text-white flex items-center justify-center text-sm shadow-md shrink-0 creature-icon-container" style="animation-delay: 0s, ${animDelay};">
                            <i class="fa-solid ${item.icon} drop-shadow"></i>
                        </div>
                        <span class="text-xs sm:text-sm font-semibold text-white tracking-wide">${item.name}</span>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="w-12 h-12 rounded-2xl text-white flex items-center justify-center text-base shadow-lg mb-2.5 creature-icon-container" style="animation-delay: 0s, ${animDelay};">
                            <i class="fa-solid ${item.icon} drop-shadow"></i>
                        </div>
                        <span class="text-xs sm:text-sm font-semibold text-white tracking-wide">${item.name}</span>
                    `;
                }

                gridEl.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', renderPortalsList);
    </script>
</body>
</html>
